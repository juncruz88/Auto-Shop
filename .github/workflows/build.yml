name: Build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Web and single-file build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build single-file HTML
        run: npm run build:single

# The APK build is intentionally not part of CI: it requires JDK 17 plus
# Android SDK build-tools 34.0.0 and platform android-34, which are not
# installed on the default runner.
