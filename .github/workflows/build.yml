name: Build

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Web and single-file build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build single-file HTML
        run: npm run build:single

  apk:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      EXPECTED_APK_CERT_SHA256: dffa71bcdc7c3318d240d0cdd6d988b158cee487eecf05ee82499b9d7067056d
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-cmdline-16-bt34-platform34-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;34.0.0 platforms;android-34"

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-version.mjs "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Build APK
        run: npm run build:apk

      - name: Verify APK version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          badging=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging downloads/ridgeline-auto-shop.apk | head -n 1)
          name=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          code=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          echo "APK version: ${name:-missing} (${code:-missing}); tag: $VERSION_NAME ($VERSION_CODE)"
          if [ "$name" != "$VERSION_NAME" ] || [ "$code" != "$VERSION_CODE" ]; then
            echo "::error::APK version ${name:-missing} (${code:-missing}) does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Verify APK signing certificate
        run: |
          cert=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs downloads/ridgeline-auto-shop.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "APK signing certificate SHA-256: $cert"
          if [ "$cert" != "$EXPECTED_APK_CERT_SHA256" ]; then
            echo "::error::Unexpected APK signing certificate: $cert"
            exit 1
          fi
          echo "APK certificate SHA-256: \`$cert\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and single-file HTML
        uses: actions/upload-artifact@v4
        with:
          name: ridgeline-auto-shop-android
          path: |
            downloads/ridgeline-auto-shop.apk
            downloads/ridgeline-auto-shop.html
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK and single-file HTML
        uses: actions/download-artifact@v4
        with:
          name: ridgeline-auto-shop-android
          path: release

      - name: Prepare checksums and install notes
        run: |
          cd release
          sha256sum ridgeline-auto-shop.apk ridgeline-auto-shop.html > SHA256SUMS
          cat > INSTALL.md <<'EOF'
          # Install Ridgeline Auto Shop

          1. Download `ridgeline-auto-shop.apk` on your Android phone.
          2. Back up your shop data in the app before replacing an older build.
          3. If the installed app was signed with a different key, uninstall it once, then install this APK.
          4. Future releases use the same signing key and install over this one.

          `ridgeline-auto-shop.html` is the standalone web app and opens in any modern browser.

          The APK is debug-signed for sideloading, not for Play Store distribution.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ridgeline Auto Shop ${{ github.ref_name }}
          files: |
            release/ridgeline-auto-shop.apk
            release/ridgeline-auto-shop.html
            release/SHA256SUMS
            release/INSTALL.md
          body_path: release/INSTALL.md
          overwrite_files: true
